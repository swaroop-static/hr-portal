name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Push test DB schema
        run: node node_modules/prisma/build/index.js db push --skip-generate
        env:
          DATABASE_URL: file:${{ github.workspace }}/backend/prisma/test.db

      - name: Run tests
        run: npx vitest run
        env:
          DATABASE_URL: file:${{ github.workspace }}/backend/prisma/test.db
          JWT_SECRET: ci-test-secret-key-minimum-32-chars-ok
          ALLOW_DIRECT_EXECUTION: 'true'
          NODE_ENV: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
