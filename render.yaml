services:
  - type: web
    name: hr-portal-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate --schema=prisma/schema.postgres.prisma
    startCommand: npx prisma db push --schema=prisma/schema.postgres.prisma && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
